[pytest]
# The protocol tests live next to the server they exercise.
testpaths = services/mcp-server

# FastAPI's on_event is deprecated in favour of lifespan handlers. That is worth
# fixing, but the warning drowns the test output until then.
filterwarnings =
    ignore::DeprecationWarning:fastapi.*
    ignore:on_event is deprecated:DeprecationWarning

addopts = -q
