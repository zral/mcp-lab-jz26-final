<header>AI Agent Workshop - Model Context Protocol</header>
<h1 id="but-first-some-context--why-agents-at-all">But first, some context — why agents at all?</h1>
<div class="columns">
<div>
<h2 id="some-problems-resist-specification">Some problems resist specification</h2>
<p><em>&quot;Going to Bergen on Friday — what should I pack?&quot;</em></p>
<ul>
<li>a thousand different wordings</li>
<li>no endpoint for it</li>
<li>no sane number of <code>if</code>s</li>
</ul>
</div>
<div>
<h2 id="agents-absorb-the-fuzziness">Agents absorb the fuzziness</h2>
<p><strong>Reasoning</strong> where the problem is vague.<br />
<strong>Plain code</strong> where it is exact.</p>
<p>A layer in front of deterministic software, not a replacement for it.</p>
</div>
</div>
<footer>Leif Terje Fonnes &amp; Lars Søraas | JavaZone 2026</footer>

<header>AI Agent Workshop - Model Context Protocol</header>
<h1 id="so-what-is-an-agent-exactly">So what is an agent, exactly?</h1>
<div class="columns">
<div>
<h2 id="an-agent-is-something-that-can">An agent is &quot;<em>something</em>&quot; that can:</h2>
<ul>
<li>Understand user requests</li>
<li>Provide contextual responses</li>
<li>Learn and adapt over time</li>
<li>Perform actions via tools</li>
<li>Fetch real-time data and resources</li>
</ul>
</div>
<div>
<h2 id="to-achieve-this-it-needs">To achieve this it needs</h2>
<ul>
<li>Reasoning
<ul>
<li>Plan, make decisions</li>
</ul>
</li>
<li>Memory
<ul>
<li>Remember, have knowledge</li>
</ul>
</li>
<li>Access to the real world
<ul>
<li>Sense, feel, act</li>
</ul>
</li>
</ul>
</div>
</div>
<h2 id="mcp-provides-access-to-tools-and-data-in-a-standardized-way">MCP provides access to tools and data in a standardized way!</h2>
<footer>Leif Terje Fonnes &amp; Lars Søraas | JavaZone 2026</footer>

<header>AI Agent Workshop - Model Context Protocol</header>
<h1 id="why-mcp">Why MCP?</h1>
<div class="columns">
<div>
<h2 id="tools-describe-themselves-in-prose">Tools describe themselves in prose</h2>
<p><code>description</code> is plain language, not types and paths — written for a reader that understands language.</p>
<p>That is how the model picks the right tool for a vague request.</p>
</div>
<div>
<h2 id="which-is-what-crosses-silos">Which is what crosses silos</h2>
<p>Weather here. News there. Your own systems next door.</p>
<p>Nothing had to agree on a schema. The agent <strong>combines</strong> them — a join nobody coded.</p>
</div>
</div>
<h3 id="being-a-standard-protocol-makes-this-easy-the-natural-language-description-is-what-makes-it-possible">Being a standard protocol makes this <em>easy</em>. The natural-language description is what makes it <em>possible</em>.</h3>
<footer>Leif Terje Fonnes &amp; Lars Søraas | JavaZone 2026</footer>
</section>

<header>AI Agent Workshop - Model Context Protocol</header>
<h1 id="mcp">MCP</h1>
<h3 id="a-protocol-for-connecting-ai-applications-to-external-systems">A <strong>protocol</strong> for connecting AI applications to external systems</h3>
<ul>
<li><strong>Transport</strong>: <strong>stdio</strong> or <strong>Streamable HTTP</strong> — one <code>POST</code> endpoint,<br />
stateless: no handshake, no session</li>
</ul>
<p><strong>Three server primitives:</strong></p>
<ul>
<li><strong>Tools</strong>: actions the model can invoke — <em>this is what we build today</em></li>
<li><strong>Resources</strong>: data and documents the client can read</li>
<li><strong>Prompts</strong>: reusable prompt templates</li>
</ul>

<h1 id="streamable-http">Streamable HTTP</h1>
<h3 id="one-endpoint-post-only-the-reply-comes-back-one-of-two-ways">One endpoint. <code>POST</code> only. The reply comes back one of two ways.</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>POST /message   -&gt;   application/json      one JSON-RPC result
                -&gt;   text/event-stream     SSE; the last event is that result
</code></pre>
<ul>
<li>The client says <strong><code>Accept: application/json, text/event-stream</code></strong> and handles both</li>
<li><strong>The server chooses</strong> — streaming is a property of one response, not of the connection</li>
<li><strong>Stateless</strong>: no <code>initialize</code>, no session id, nothing held open</li>
</ul>
<h3 id="2026-07-28-removed-the-get-stream--a-get-on-the-endpoint-is-now-405"><code>2026-07-28</code> removed the GET stream — a <code>GET</code> on the endpoint is now <code>405</code></h3>

<p><code>gemini-3.7-flash</code> — the one the docs push for &quot;agentic workflows&quot; — failed two of five calls with <code>429</code> and <code>503</code>, and was <strong>7× slower</strong>.<br />
Newest means <em>most contended</em>, and on a free tier you feel that first.</p>
<p>Free-tier quota says the same: <strong>lite gets 500 requests/day, plain Flash gets 20.</strong></p>

<header>AI Agent Workshop - Model Context Protocol</header>
<h1 id="how-2026-07-28-works">How <code>2026-07-28</code> Works</h1>
<h2 id="the-big-idea-mcp-is-stateless">The big idea: <strong>MCP is stateless</strong></h2>
<blockquote>
<p>&quot;The Model Context Protocol (MCP) is a stateless protocol: all the information<br />
needed to process a request is contained in the request itself.&quot;</p>
</blockquote>
<div class="columns">
<div>
<h3 id="every-request-carries">Every request carries</h3>
<ul>
<li><code>_meta</code> — protocol version and client capabilities</li>
<li>The same values mirrored into HTTP headers</li>
<li>Everything needed to serve it: nothing is remembered</li>
</ul>
</div>
<div>
<h3 id="every-server-must">Every server must</h3>
<ul>
<li>Implement <code>server/discover</code></li>
<li>Return <code>resultType</code> on every result</li>
<li>Add <code>ttlMs</code> / <code>cacheScope</code> to list results</li>
<li>Validate the <code>Origin</code> header</li>
</ul>
</div>
</div>
<h3 id="no-handshake-no-session-if-you-find-initialize-in-a-tutorial-it-predates-the-spec">No handshake, no session. If you find <code>initialize</code> in a tutorial, it predates the spec.</h3>
<footer>Leif Terje Fonnes &amp; Lars Søraas | JavaZone 2026</footer>
</section>

<header>AI Agent Workshop - Model Context Protocol</header>
<h1 id="why-both-header-and-body">Why Both Header <em>and</em> Body?</h1>
<h2 id="the-body-is-the-truth-the-headers-are-mirrors">The body is the truth. The headers are mirrors.</h2>
<p>Headers exist so <strong>intermediaries</strong> — load balancers, gateways, observability tooling — can route and inspect <strong>without parsing JSON</strong>.</p>
<h3 id="the-server-must-check-that-the-two-agree">The server <strong>MUST</strong> check that the two agree</h3>
<p>If they disagree, you have an attack surface: a gateway that waves through</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-http"><span class="hljs-attribute">Mcp-Name</span><span class="hljs-punctuation">: </span>read_document
</code></pre>
<p>while the body actually says</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-json"><span class="hljs-punctuation">{</span> <span class="hljs-attr">&quot;name&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;delete_everything&quot;</span> <span class="hljs-punctuation">}</span>
</code></pre>
<h3 id="%E2%86%92-400-bad-request-with-error-code--32020-headermismatch">→ <code>400 Bad Request</code> with error code <code>-32020</code> (<code>HeaderMismatch</code>)</h3>
<p><strong>Note:</strong> <code>Mcp-Name</code> only applies to methods that have a name parameter<br />
(<code>tools/call</code>, <code>resources/read</code>, <code>prompts/get</code>). <code>tools/list</code> has none.</p>
<footer>Leif Terje Fonnes &amp; Lars Søraas | JavaZone 2026</footer>

<header>AI Agent Workshop - Model Context Protocol</header>
<h1 id="error-codes-are-now-tied-to-http-status-codes">Error Codes Are Now Tied to HTTP Status Codes</h1>
<h2 id="this-is-the-biggest-change-to-get-used-to-in-practice">This is the biggest change to get used to in practice</h2>
<p>Before, the server always answered <code>200 OK</code> and put the error in the body.</p>
<table>
<thead>
<tr>
<th>Code</th>
<th>Name</th>
<th>HTTP</th>
<th>When</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>-32700</code></td>
<td>Parse error</td>
<td>400</td>
<td>invalid JSON</td>
</tr>
<tr>
<td><code>-32600</code></td>
<td>Invalid Request</td>
<td>400</td>
<td>not valid JSON-RPC 2.0</td>
</tr>
<tr>
<td><code>-32601</code></td>
<td>Method not found</td>
<td><strong>404</strong></td>
<td>unknown method</td>
</tr>
<tr>
<td><code>-32602</code></td>
<td>Invalid params</td>
<td>400</td>
<td>missing <code>_meta</code> or parameters</td>
</tr>
<tr>
<td><code>-32020</code></td>
<td>HeaderMismatch</td>
<td>400</td>
<td>header disagrees with the body</td>
</tr>
<tr>
<td><code>-32022</code></td>
<td>UnsupportedProtocolVersion</td>
<td>400</td>
<td>we don't speak that version</td>
</tr>
<tr>
<td><code>1001</code></td>
<td>Origin not allowed</td>
<td>403</td>
<td>invalid <code>Origin</code> (our own code)</td>
</tr>
</tbody>
</table>
<h3 id="why-404-for-an-unknown-method">Why <code>404</code> for an unknown method?</h3>
<p>So a client can tell a <strong>modern server</strong> (404 <em>with</em> a JSON-RPC body) from a <strong>legacy HTTP+SSE server</strong> that doesn't host the endpoint at all (404 without one). <strong>Without</strong> the status code the two are indistinguishable.</p>

<h1 id="serverdiscover--everything-in-one-call"><code>server/discover</code> — Everything in One Call</h1>
<p>Servers <strong>MUST</strong> implement it. One request returns versions, capabilities and identity.</p>

<header>AI Agent Workshop - Model Context Protocol</header>
<h1 id="mrtr-the-new-mental-model">MRTR: The New Mental Model</h1>
<h2 id="what-happens-when-the-server-needs-something-from-the-client">What happens when the <em>server</em> needs something from the <em>client</em>?</h2>
<p>Sampling, elicitation, asking for roots — and no SSE stream to send it down.</p>
<h3 id="now-the-server-returns-an-unfinished-result">Now the server returns an unfinished result</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-json"><span class="hljs-punctuation">{</span> <span class="hljs-attr">&quot;resultType&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;input_required&quot;</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;inputRequests&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">[</span> <span class="hljs-punctuation">{</span> <span class="hljs-attr">&quot;method&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;elicitation/create&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;...&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;...&quot;</span> <span class="hljs-punctuation">}</span> <span class="hljs-punctuation">]</span> <span class="hljs-punctuation">}</span>
</code></pre>
<p>The client gathers the input and <strong>retries the original request</strong>, carrying <code>inputResponses</code>.</p>
<div class="columns">
<div>
<h3 id="why-its-better">Why it's better</h3>
<ul>
<li>No server-initiated requests to route</li>
<li>Works identically on stdio and HTTP</li>
<li>Survives a dropped connection</li>
<li>Retry is just another stateless POST</li>
</ul>
</div>
<div>
<h3 id="why-resulttype-matters">Why <code>resultType</code> matters</h3>
<p>Every result declares what it is, so a client that only handles <code>&quot;complete&quot;</code> knows at once when it got something else.<br />
Absent <code>resultType</code> → treat as <code>&quot;complete&quot;</code>.</p>
<p><strong>Not implemented here</strong> — but recognise it when you meet it.</p>
</div>
</div>

<header>AI Agent Workshop - Model Context Protocol</header>
<h1 id="security-origin-and-dns-rebinding">Security: <code>Origin</code> and DNS Rebinding</h1>
<h2 id="servers-must-validate-origin-this-is-not-a-formality">Servers <strong>MUST</strong> validate <code>Origin</code>. This is not a formality.</h2>
<div class="columns">
<div>
<h3 id="the-attack">The attack</h3>
<ul>
<li>You open a page on <code>evil.example.com</code></li>
<li>Its DNS record has a one-second TTL, and<br />
re-resolves to <code>127.0.0.1</code></li>
<li>The browser now believes the page's origin<br />
is on <em>your</em> machine</li>
<li>It posts to your MCP server on <code>localhost:8000</code></li>
<li>Every tool you exposed is reachable from a<br />
web page</li>
</ul>
<p><strong>Relevant right now:</strong> this workshop runs in<br />
Codespaces with forwarded ports.</p>
</div>
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># services/mcp-server/mcp_protocol.py</span>

<h3 id="why-is-no-origin-allowed">Why is &quot;no <code>Origin</code>&quot; allowed?</h3>
<ul>
<li>The <strong>browser</strong> sets it — and the browser is<br />
the attack path</li>
<li>Server-to-server traffic never sends one</li>
<li>Absent is fine; <em>present and untrusted</em> is <code>403</code></li>
<li>Configure with <code>MCP_ALLOWED_ORIGINS</code> in <code>.env</code></li>

<h1 id="agent---fetching-tools-from-mcp-server">Agent - Fetching Tools from MCP Server</h1>
<div style="font-size: small;">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># services/agent/app.py</span>

PROTOCOL_VERSION = <span class="hljs-string">&quot;2026-07-28&quot;</span>

<span class="hljs-keyword">def</span> <span class="hljs-title function_">build_request</span>(<span class="hljs-params">method: <span class="hljs-built_in">str</span>, params: <span class="hljs-built_in">dict</span> | <span class="hljs-literal">None</span> = <span class="hljs-literal">None</span>, name: <span class="hljs-built_in">str</span> | <span class="hljs-literal">None</span> = <span class="hljs-literal">None</span></span>):
    <span class="hljs-string">&quot;&quot;&quot;Every MCP request needs _meta in the body and mirrored headers.&quot;&quot;&quot;</span>
    params = <span class="hljs-built_in">dict</span>(params <span class="hljs-keyword">or</span> {})
    params[<span class="hljs-string">&quot;_meta&quot;</span>] = {
        <span class="hljs-string">&quot;io.modelcontextprotocol/protocolVersion&quot;</span>: PROTOCOL_VERSION,
        <span class="hljs-string">&quot;io.modelcontextprotocol/clientCapabilities&quot;</span>: {},
        <span class="hljs-string">&quot;io.modelcontextprotocol/clientInfo&quot;</span>: {<span class="hljs-string">&quot;name&quot;</span>: <span class="hljs-string">&quot;travel-agent&quot;</span>, <span class="hljs-string">&quot;version&quot;</span>: <span class="hljs-string">&quot;1.0.0&quot;</span>},
    }
    headers = {
        <span class="hljs-string">&quot;Accept&quot;</span>: <span class="hljs-string">&quot;application/json, text/event-stream&quot;</span>,
        <span class="hljs-string">&quot;MCP-Protocol-Version&quot;</span>: PROTOCOL_VERSION,
        <span class="hljs-string">&quot;Mcp-Method&quot;</span>: method,
    }
    <span class="hljs-keyword">if</span> name:                      <span class="hljs-comment"># only for tools/call, resources/read, prompts/get</span>
        headers[<span class="hljs-string">&quot;Mcp-Name&quot;</span>] = name
    <span class="hljs-keyword">return</span> {<span class="hljs-string">&quot;jsonrpc&quot;</span>: <span class="hljs-string">&quot;2.0&quot;</span>, <span class="hljs-string">&quot;id&quot;</span>: <span class="hljs-number">1</span>, <span class="hljs-string">&quot;method&quot;</span>: method, <span class="hljs-string">&quot;params&quot;</span>: params}, headers

<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">load_tools_from_mcp_server</span>(<span class="hljs-params">self</span>):
    body, headers = build_request(<span class="hljs-string">&quot;tools/list&quot;</span>)
    response = <span class="hljs-keyword">await</span> <span class="hljs-variable language_">self</span>.http_client.post(
        <span class="hljs-string">f&quot;<span class="hljs-subst">{self.mcp_server_url}</span>/message&quot;</span>, json=body, headers=headers)
    result = response.json()[<span class="hljs-string">&quot;result&quot;</span>]

    <span class="hljs-comment"># Convert from MCP format to OpenAI function calling format</span>
    <span class="hljs-keyword">for</span> tool <span class="hljs-keyword">in</span> result.get(<span class="hljs-string">&quot;tools&quot;</span>, []):
        <span class="hljs-variable language_">self</span>.tools.append({
            <span class="hljs-string">&quot;type&quot;</span>: <span class="hljs-string">&quot;function&quot;</span>,
            <span class="hljs-string">&quot;function&quot;</span>: {
                <span class="hljs-string">&quot;name&quot;</span>: tool[<span class="hljs-string">&quot;name&quot;</span>],
                <span class="hljs-string">&quot;description&quot;</span>: tool[<span class="hljs-string">&quot;description&quot;</span>],
                <span class="hljs-string">&quot;parameters&quot;</span>: tool[<span class="hljs-string">&quot;inputSchema&quot;</span>],
            },
        })

<header>AI Agent Workshop - Model Context Protocol</header>
<h1 id="%F0%9F%94%84-the-mcp-endpoint"><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f504.svg" data-marp-twemoji=""/> The MCP Endpoint</h1>
<div class="columns">
<div>
<h3 id="server-validate-then-route">Server: validate, then route</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-meta">@app.post(<span class="hljs-params"><span class="hljs-string">&quot;/message&quot;</span></span>)</span>
<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">handle_jsonrpc</span>(<span class="hljs-params">request: Request</span>):
    <span class="hljs-comment"># 1. Origin, before anything else</span>
    mcp_protocol.validate_origin(
        request.headers.get(<span class="hljs-string">&quot;origin&quot;</span>))

    <span class="hljs-comment"># 2. parse the JSON-RPC envelope</span>
    payload = <span class="hljs-keyword">await</span> request.json()

    <span class="hljs-comment"># 3. _meta + mirrored headers. Raises</span>
    <span class="hljs-comment">#    with the right code AND status.</span>
    req = mcp_protocol.validate_request(
        method=payload[<span class="hljs-string">&quot;method&quot;</span>],
        params=payload.get(<span class="hljs-string">&quot;params&quot;</span>),
        headers=request.headers,
        request_id=payload[<span class="hljs-string">&quot;id&quot;</span>])

    <span class="hljs-comment"># 4. route</span>
    <span class="hljs-keyword">if</span> req.method == <span class="hljs-string">&quot;tools/list&quot;</span>:
        <span class="hljs-keyword">return</span> jsonrpc_result(
            payload[<span class="hljs-string">&quot;id&quot;</span>],
            <span class="hljs-keyword">await</span> handle_tools_list())

    <span class="hljs-keyword">raise</span> mcp_protocol.method_not_found(
        req.method, SUPPORTED_METHODS)   <span class="hljs-comment"># 404</span>
</code></pre>
</div>
<div>
<h3 id="client-body-and-headers-together">Client: body and headers together</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">body, headers = build_mcp_request(
    <span class="hljs-string">&quot;tools/call&quot;</span>,
    {<span class="hljs-string">&quot;name&quot;</span>: <span class="hljs-string">&quot;get_weather_forecast&quot;</span>,
     <span class="hljs-string">&quot;arguments&quot;</span>: {<span class="hljs-string">&quot;location&quot;</span>: <span class="hljs-string">&quot;Oslo&quot;</span>}},
)

response = <span class="hljs-keyword">await</span> http_client.post(
    <span class="hljs-string">&quot;/message&quot;</span>, json=body, headers=headers)

result = parse_mcp_response(response)[<span class="hljs-string">&quot;result&quot;</span>]
</code></pre>
<h3 id="one-function-builds-both">One function builds both</h3>
<p><code>build_mcp_request()</code> adds <code>params._meta</code> <strong>and</strong> the<br />
four headers that mirror it. Hand-assembling a body<br />
is how you forget <code>_meta</code> and lose ten minutes to a <code>400</code>.</p>
<h3 id="parse_mcp_response-handles-json-and-sse"><code>parse_mcp_response()</code> handles JSON <em>and</em> SSE</h3>
<p>A conforming server may answer with either.<br />
The client <strong>MUST</strong> cope with both.</p>
</div>

<header>AI Agent Workshop - Model Context Protocol</header>
<h1 id="%F0%9F%9B%A1%EF%B8%8F-mcp_protocolpy--the-doorman"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f6e1.svg" data-marp-twemoji=""/> <code>mcp_protocol.py</code> — the Doorman</h1>
<div class="columns">
<div>
<h2 id="validation-order-is-deliberate">Validation order is deliberate</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># 1. _meta fields        -&gt; -32602, 400</span>
<span class="hljs-comment"># 2. Headers mirror body -&gt; -32020, 400</span>
<span class="hljs-comment"># 3. Version supported   -&gt; -32022, 400</span>
</code></pre>
<p><strong>The body is the truth</strong>, so we check it is complete first.</p>
<p>Swap steps 1 and 2, and a client that forgot <code>_meta</code> gets told &quot;header mismatch&quot; against a value that doesn't exist — a useless error message.</p>
</div>
<div>
<h2 id="two-details-that-bite">Two details that bite</h2>
<h3 id="origin-may-be-absent"><code>Origin</code> may be absent</h3>
<p>curl and the agent send none. It's the <strong>browser</strong> that sets <code>Origin</code>, and the browser is what the attack goes through.<br />
Absent is fine; <em>present and wrong</em> is <code>403</code>.</p>
<h3 id="header-values-must-be-plain-ascii">Header values must be plain ASCII</h3>
<p>A tool name with <code>æ</code>, <code>ø</code> or <code>å</code> is wrapped by the client and<br />
<strong>MUST</strong> be decoded by the server before comparison:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-http"><span class="hljs-attribute">Mcp-Name</span><span class="hljs-punctuation">: </span>=?base64?VHJvbXPDuA==?=
</code></pre>
</div>

<h1 id="lab-exercise-1-explore-existing-tools">Lab Exercise 1: Explore Existing Tools</h1>
<h2 id="examine-the-weather-tool-and-the-mcp-architecture">Examine the weather tool and the MCP architecture</h2>
<div class="columns">
<div>
<h3 id="run-these">Run these</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">docker compose up -d

make curl-discover   <span class="hljs-comment"># versions, capabilities</span>
make curl-list       <span class="hljs-comment"># what tools exist?</span>
make curl-weather    <span class="hljs-comment"># weather for Oslo</span>
make curl-agent      <span class="hljs-comment"># through the agent</span>
</code></pre>
<p>The <code>make</code> targets set the four required headers for you — that is the whole reason they exist.</p>
</div>
<div>
<h3 id="what-make-curl-list-actually-runs">What <code>make curl-list</code> actually runs</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">curl -s -X POST localhost:8000/message \
  -H <span class="hljs-string">&quot;Content-Type: application/json&quot;</span> \
  -H <span class="hljs-string">&quot;Accept: application/json, text/event-stream&quot;</span> \
  -H <span class="hljs-string">&quot;MCP-Protocol-Version: 2026-07-28&quot;</span> \
  -H <span class="hljs-string">&quot;Mcp-Method: tools/list&quot;</span> \
  -d <span class="hljs-string">&#x27;{...,&quot;params&quot;:{&quot;_meta&quot;:{...}}}&#x27;</span>
</code></pre>
</div>
</div>
<h3 id="testing-by-hand-means-building-the-headers-yourself--which-is-what-helpermcp-curl-is-for">Testing by hand means building the headers yourself — which is what <code>helper/mcp-curl</code> is for.</h3>

<header>AI Agent Workshop - Model Context Protocol</header>
<h1 id="lab-exercise-15-break-it-on-purpose">Lab Exercise 1.5: Break It on Purpose</h1>
<h2 id="the-fastest-way-to-understand-the-new-rules-is-to-violate-them">The fastest way to understand the new rules is to violate them</h2>
<div class="columns">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">make curl-mismatch   <span class="hljs-comment"># header disagrees with body</span>
make curl-nometa     <span class="hljs-comment"># no _meta in params</span>
make curl-badversion <span class="hljs-comment"># a version we don&#x27;t speak</span>
make curl-unknown    <span class="hljs-comment"># a method that doesn&#x27;t exist</span>
</code></pre>
<h3 id="what-you-should-see">What you should see</h3>
<table>
<thead>
<tr>
<th>Command</th>
<th>HTTP</th>
<th>Error code</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>curl-mismatch</code></td>
<td><code>400</code></td>
<td><code>-32020</code> HeaderMismatch</td>
</tr>
<tr>
<td><code>curl-nometa</code></td>
<td><code>400</code></td>
<td><code>-32602</code> Invalid params</td>
</tr>
<tr>
<td><code>curl-badversion</code></td>
<td><code>400</code></td>
<td><code>-32022</code> + <code>data.supported</code></td>
</tr>
<tr>
<td><code>curl-unknown</code></td>
<td><code>404</code></td>
<td><code>-32601</code> Method not found</td>
</tr>
</tbody>
</table>
</div>
<div>
<h3 id="try-this-too">Try this too</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">curl -i -X POST <span class="hljs-string">&quot;http://localhost:8000/message&quot;</span> \
  -H <span class="hljs-string">&quot;Origin: https://evil.example.com&quot;</span> ...
<span class="hljs-comment"># -&gt; 403, untrusted origin</span>
</code></pre>
<p><strong>Look at <code>data.supported</code> in the <code>-32022</code> response</strong> — that is how a client discovers what to retry with, without a handshake.</p>
</div>
</div>

<h3 id="step-1-add-fact-endpoint-to-mcp-server">Step 1: Add fact endpoint to MCP Server</h3>
<div style="font-size: small;">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># In services/mcp-server/app.py</span>

<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">get_random_fact</span>(<span class="hljs-params">category: <span class="hljs-built_in">str</span> = <span class="hljs-string">&quot;general&quot;</span></span>) -&gt; <span class="hljs-type">Dict</span>[<span class="hljs-built_in">str</span>, <span class="hljs-type">Any</span>]:
    <span class="hljs-string">&quot;&quot;&quot;Get a random interesting fact.&quot;&quot;&quot;</span>
    <span class="hljs-keyword">try</span>:
        facts = {
            <span class="hljs-string">&quot;general&quot;</span>: [<span class="hljs-string">&quot;Honeybees produce food eaten by humans.&quot;</span>,
                       <span class="hljs-string">&quot;Bananas are berries, but strawberries are not.&quot;</span>],
            <span class="hljs-string">&quot;space&quot;</span>: [<span class="hljs-string">&quot;A day on Venus is longer than its year.&quot;</span>,
                     <span class="hljs-string">&quot;Saturn would float in water.&quot;</span>]
        }

        <span class="hljs-keyword">import</span> random
        fact = random.choice(facts.get(category, facts[<span class="hljs-string">&quot;general&quot;</span>]))

        result = {
            <span class="hljs-string">&quot;category&quot;</span>: category,
            <span class="hljs-string">&quot;fact&quot;</span>: fact,
            <span class="hljs-string">&quot;timestamp&quot;</span>: datetime.now().isoformat()
        }

        <span class="hljs-keyword">return</span> result

    <span class="hljs-keyword">except</span> Exception <span class="hljs-keyword">as</span> e:
        logger.error(<span class="hljs-string">f&quot;Fact retrieval error: <span class="hljs-subst">{e}</span>&quot;</span>)
        <span class="hljs-keyword">return</span> {<span class="hljs-string">&quot;error&quot;</span>: <span class="hljs-string">f&quot;Could not retrieve fact: <span class="hljs-subst">{<span class="hljs-built_in">str</span>(e)}</span>&quot;</span>}

                   <span class="hljs-string">&quot;draft/2020-12/schema&quot;</span>,

</code></pre>
<p>The weather entry already ends with a comma, so this pastes in cleanly.</p>

<div>
<h3 id="the-return-already-has-what-the-revision-needs">The <code>return</code> already has what the revision needs</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">return</span> {

<h1 id="lab-exercise-2-handle-tool-calls">Lab Exercise 2: Handle Tool Calls</h1>
<h3 id="step-3-add-routing-in-handle_tools_call">Step 3: Add routing in handle_tools_call()</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># In handle_tools_call(), add:</span>

<span class="hljs-keyword">elif</span> tool_name == <span class="hljs-string">&quot;get_random_fact&quot;</span>:
    category = arguments.get(<span class="hljs-string">&quot;category&quot;</span>, <span class="hljs-string">&quot;general&quot;</span>)

    result = <span class="hljs-keyword">await</span> get_random_fact(category)

    <span class="hljs-keyword">if</span> <span class="hljs-string">&quot;error&quot;</span> <span class="hljs-keyword">in</span> result:
        <span class="hljs-keyword">return</span> {
            <span class="hljs-string">&quot;resultType&quot;</span>: <span class="hljs-string">&quot;complete&quot;</span>,
            <span class="hljs-string">&quot;content&quot;</span>: [{<span class="hljs-string">&quot;type&quot;</span>: <span class="hljs-string">&quot;text&quot;</span>, <span class="hljs-string">&quot;text&quot;</span>: json.dumps(result, ensure_ascii=<span class="hljs-literal">False</span>)}],
            <span class="hljs-string">&quot;isError&quot;</span>: <span class="hljs-literal">True</span>
        }

    <span class="hljs-keyword">return</span> {
        <span class="hljs-string">&quot;resultType&quot;</span>: <span class="hljs-string">&quot;complete&quot;</span>,
        <span class="hljs-string">&quot;content&quot;</span>: [{<span class="hljs-string">&quot;type&quot;</span>: <span class="hljs-string">&quot;text&quot;</span>, <span class="hljs-string">&quot;text&quot;</span>: json.dumps(result, ensure_ascii=<span class="hljs-literal">False</span>, indent=<span class="hljs-number">2</span>)}],
        <span class="hljs-string">&quot;structuredContent&quot;</span>: result,
        <span class="hljs-string">&quot;isError&quot;</span>: <span class="hljs-literal">False</span>
    }
</code></pre>
<h3 id="resulttype-is-required-on-every-result--including-the-error-path"><code>resultType</code> is required on <strong>every</strong> result — including the error path</h3>
<p><code>tools/call</code> results are not cacheable, so no <code>ttlMs</code> or <code>cacheScope</code> here - <code>tools/list</code> needs both.</p>

<h1 id="lab-exercise-2-test-the-new-tool">Lab Exercise 2: Test the New Tool</h1>
<h3 id="step-4-compliance-testing">Step 4: Compliance Testing</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># Rebuild (agent fetches tools at startup)</span>
docker compose build mcp-server travel-agent
docker compose up -d

make curl-list          <span class="hljs-comment"># both tools should now be listed</span>
make curl-fact          <span class="hljs-comment"># tools/call for get_random_fact</span>
make curl-fact-agent    <span class="hljs-comment"># the same, through the agent</span>

<span class="hljs-comment"># Third-party validation with the official SDK</span>
make test-compliance
</code></pre>
<h3 id="calling-the-tool-by-hand-remember-mcp-name">Calling the tool by hand? Remember <code>Mcp-Name</code></h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">curl -s -X POST <span class="hljs-string">&quot;http://localhost:8000/message&quot;</span> \
  -H <span class="hljs-string">&quot;Content-Type: application/json&quot;</span> \
  -H <span class="hljs-string">&quot;MCP-Protocol-Version: 2026-07-28&quot;</span> \
  -H <span class="hljs-string">&quot;Mcp-Method: tools/call&quot;</span> \
  -H <span class="hljs-string">&quot;Mcp-Name: get_random_fact&quot;</span> \
  -d <span class="hljs-string">&#x27;{&quot;jsonrpc&quot;:&quot;2.0&quot;,&quot;id&quot;:2,&quot;method&quot;:&quot;tools/call&quot;,&quot;params&quot;:{
       &quot;name&quot;:&quot;get_random_fact&quot;,&quot;arguments&quot;:{&quot;category&quot;:&quot;space&quot;},
       &quot;_meta&quot;:{&quot;io.modelcontextprotocol/protocolVersion&quot;:&quot;2026-07-28&quot;,
                &quot;io.modelcontextprotocol/clientCapabilities&quot;:{}}}}&#x27;</span> | python3 -m json.tool
</code></pre>
<p>Get <code>Mcp-Name</code> wrong and you get <code>400</code> / <code>-32020</code> — not a tool error. <strong>That's the point.</strong></p>

<li>Add a manifest entry and a routing branch</li>

<p>The tool returns plain data with an <code>error</code> key on failure — never an MCP result. That shape belongs in the routing branch.</p>

                timeout=<span class="hljs-number">10.0</span>, follow_redirects=<span class="hljs-literal">True</span>,

            r.raise_for_status()

             <span class="hljs-string">&quot;published&quot;</span>: _to_iso(i.findtext(<span class="hljs-string">&quot;pubDate&quot;</span>))}
            <span class="hljs-keyword">for</span> i <span class="hljs-keyword">in</span> root.findall(<span class="hljs-string">&quot;.//item&quot;</span>)[:<span class="hljs-number">5</span>]
        ]

    <span class="hljs-keyword">except</span> httpx.HTTPError <span class="hljs-keyword">as</span> e:

<tr>

<tr>

<h1 id="tips---debugging">Tips - Debugging</h1>
<div class="columns">
<div>
<h3 id="%F0%9F%94%B4-container-wont-start"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f534.svg" data-marp-twemoji=""/> Container won't start</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">docker compose logs service-name
</code></pre>
<h3 id="%F0%9F%94%B4-api-calls-failing"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f534.svg" data-marp-twemoji=""/> API calls failing</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">docker compose <span class="hljs-built_in">exec</span> travel-agent <span class="hljs-built_in">env</span> | grep API
</code></pre>
<h3 id="%F0%9F%94%B4-tool-not-recognized"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f534.svg" data-marp-twemoji=""/> Tool not recognized</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">curl http://localhost:8001/health
</code></pre>
</div>
<div>
<h3 id="%F0%9F%94%B4-everything-returns-400"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f534.svg" data-marp-twemoji=""/> Everything returns <code>400</code></h3>
<p>New in this revision. <strong>Read the error code in the body:</strong><br />
<code>-32602</code> means you forgot <code>_meta</code>,<br />
<code>-32020</code> means a header disagrees with it.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">docker compose logs mcp-server | grep Rejected
</code></pre>
<h3 id="%F0%9F%94%B4-404-on-a-method-you-know-exists"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f534.svg" data-marp-twemoji=""/> <code>404</code> on a method you know exists</h3>
<p>Check the spelling in <strong>both</strong> <code>Mcp-Method</code> and the body.<br />
And remember: <code>404</code> <em>is</em> the correct answer for an unknown method now.</p>

<header>AI Agent Workshop - Model Context Protocol</header>
<h1 id="what-you-have-learned">What You Have Learned</h1>
<div class="columns" >
<div>
<h2 id="%F0%9F%A7%A0-concepts"><img class="emoji" draggable="false" alt="🧠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f9e0.svg" data-marp-twemoji=""/> <strong>Concepts</strong></h2>
<ul>
<li>Model Context Protocol fundamentals</li>
<li><strong>Why a protocol goes stateless</strong> — and what it costs</li>
<li>Per-request <code>_meta</code> and mirrored headers</li>
<li>Dynamic tool discovery and loading</li>
<li>AI agent architecture patterns</li>
</ul>
<h2 id="%F0%9F%9A%80-best-practices"><img class="emoji" draggable="false" alt="🚀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f680.svg" data-marp-twemoji=""/> <strong>Best Practices</strong></h2>
<ul>
<li>Error codes paired with HTTP status codes</li>
<li>Validating that headers agree with the body</li>
<li><code>Origin</code> validation against DNS rebinding</li>
<li>Caching hints: <code>ttlMs</code> and <code>cacheScope</code></li>
</ul>
</div>
<div>
<h2 id="%F0%9F%9B%A0%EF%B8%8F-practical-skills"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f6e0.svg" data-marp-twemoji=""/> <strong>Practical Skills</strong></h2>
<ul>
<li>Building MCP-compatible tools</li>
<li>Integrating external APIs securely</li>
<li>Docker containerization and docker compose orchestration</li>
<li>Testing strategies, including protocol-level tests</li>
<li>Conversation memory in a stateless protocol</li>
</ul>
</div>
</div>
<h3 id="the-one-line-takeaway">The one-line takeaway</h3>
<p><strong>Everything the server needs to answer is in the request you just sent.</strong></p>

<header>AI Agent Workshop - Model Context Protocol</header>
<h1 id="take-it-further">Take It Further</h1>
<p>Four exercises to do after the workshop. The repo has everything you need.</p>
<div class="columns">
<div>
<h3 id="1-improve-the-weather-tool">1. Improve the weather tool</h3>
<p>Add UV index, air quality, sunrise and sunset. <strong>yr.no already returns all of it</strong> in the same response you are parsing — no new API, no key.</p>
<h3 id="2-a-calculator-tool">2. A calculator tool</h3>
<p>Basic arithmetic, expressions, step-by-step answers. The smallest possible second tool, good for confirming the pattern stuck.</p>
</div>
<div>
<h3 id="3-memory-enabled-chat">3. Memory-enabled chat</h3>
<p>Remember favourite cities and units across sessions.<br />
Start in <code>conversation_memory.py</code>.</p>
<h3 id="4-orchestration">4. Orchestration</h3>
<p>Chain tools: weather → attractions → calendar → summary.<br />
This is where agents get genuinely useful, and genuinely hard.</p>
</div>
</div>
<h3 id="and-the-one-that-teaches-the-most">And the one that teaches the most</h3>
<p>Point this agent at <strong>someone else's MCP server</strong>.<br />
That is when you find out whether your client really handles both JSON and SSE responses.</p>
<footer>Leif Terje Fonnes &amp; Lars Søraas | JavaZone 2026</footer>

  padding: 40px;
}
h1 {
  font-size: 42px;
  margin-bottom: 0.4em;
  margin-top: 0.2em;
}
h2 {
  font-size: 32px;
  margin-bottom: 0.3em;
  margin-top: 0.2em;
}
h3 {
  font-size: 28px;
  margin-bottom: 0.2em;
  margin-top: 0.2em;
}
li {
  margin-bottom: 0.2em;
}
code {
  font-size: 18px;
}
pre {
  font-size: 16px;
  line-height: 1.2;
  margin: 0.5em 0;
}
ul, ol {
  margin: 0.5em 0;
}
.columns {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1rem; /* Adds space between columns */
}
/* ---- Code blocks -----------------------------------------------------
   Same trap as the tables: Marp's default theme styles `pre` for a light
   background, so a dark deck gets white boxes with dark text. Readable,
   but it fights everything around it. */
section pre {
  background: #101317;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 3px;
  box-shadow: none;
  color: #e8eaed;
}
section pre code {
  background: transparent;
  color: #e8eaed;
}
/* highlight.js token colours, re-tuned for the dark background. */
section pre code .hljs-comment,
section pre code .hljs-quote     { color: #7d8590; }
section pre code .hljs-string,
section pre code .hljs-attr      { color: #a5d6ff; }
section pre code .hljs-keyword,
section pre code .hljs-built_in  { color: #ff7b72; }
section pre code .hljs-title,
section pre code .hljs-function  { color: #d2a8ff; }
section pre code .hljs-number,
section pre code .hljs-literal   { color: #79c0ff; }
/* ---- Tables ----------------------------------------------------------
   Marp's default theme styles tables for a LIGHT background: white fill,
   pale header, dark text. This deck is #1e1e1e with white text, so the
   default renders as a white block with near-invisible text.

   These selectors are prefixed with `section` on purpose - the theme's own
   rules are `section table`, and a bare `table` loses on specificity. */
section table {
  border-collapse: collapse;
  width: 100%;
  margin: 0.5em 0;
  font-size: 0.78em;
  background: transparent;
  box-shadow: none;
}
section table thead th {
  background: rgba(255, 255, 255, 0.12);
  color: #ffffff;
  font-weight: 600;
  text-align: left;
  padding: 0.4em 0.65em;
  border: none;
  border-bottom: 2px solid rgba(255, 255, 255, 0.4);
  white-space: nowrap;
}
section table tbody td {
  background: transparent;
  color: #e8eaed;
  padding: 0.35em 0.65em;
  border: none;
  border-bottom: 1px solid rgba(255, 255, 255, 0.14);
}
/* The theme paints the row, not the cell:
     `section table tr { background-color: var(--bgColor-default) }`
     which is white. Setting only td/th to transparent lets it show
     straight through - that was the actual bug. */
section table tr {
  background-color: transparent;
  border-top: none;
}
section table tbody tr:nth-child(2n) {
  background-color: rgba(255, 255, 255, 0.05);
}
section table tbody tr:last-child td { border-bottom: none; }
section table strong { color: #ffffff; font-weight: 600; }
section table code {
  background: rgba(255, 255, 255, 0.12);
  color: #ffffff;
  padding: 0.05em 0.3em;
  border-radius: 2px;
}
